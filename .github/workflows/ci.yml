name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit-tests:
    name: Unit tests (windows-latest, Py ${{ matrix.python }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install deps
        working-directory: mcp-server
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
      - name: pytest
        working-directory: mcp-server
        run: pytest tests/ -v

  validate-manifest:
    name: Validate winget manifest
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: winget validate
        shell: pwsh
        run: winget validate --manifest build/manifests/0.1.4

  build-installer:
    name: Build installer + smoke-run the bundled exe
    runs-on: windows-latest
    needs: [unit-tests]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Ensure Inno Setup
        shell: pwsh
        run: |
          # windows-latest ships Inno Setup; winget exits 1 when it's already
          # installed with no upgrade. Tolerate that, then verify ISCC exists.
          winget install --id JRSoftware.InnoSetup --silent --accept-package-agreements --accept-source-agreements --disable-interactivity
          $iscc = @(
            "C:\Program Files (x86)\Inno Setup 6\ISCC.exe",
            "$env:LOCALAPPDATA\Programs\Inno Setup 6\ISCC.exe",
            "C:\Program Files\Inno Setup 6\ISCC.exe"
          ) | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) { throw "ISCC.exe not found after install attempt" }
          Write-Host "ISCC at: $iscc"
          exit 0
      - name: Set up venv + deps + pyinstaller
        working-directory: mcp-server
        shell: pwsh
        run: |
          python -m venv .venv
          .\.venv\Scripts\python.exe -m pip install --upgrade pip
          .\.venv\Scripts\python.exe -m pip install -r requirements-dev.txt
      - name: Build bundle + installer
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $version = if ($tag -match '^v(\d+\.\d+\.\d+)') { $Matches[1] } else { "0.0.0-ci" }
          .\build\build.ps1 -Version $version
      - name: Smoke-run the bundled exe over stdio
        shell: pwsh
        run: python build/stdio_smoke.py dist/windows-login-monitor-mcp.exe

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-login-monitor-mcp-installer
          path: dist/WindowsLoginMonitorMcp-Setup-*.exe
          retention-days: 14
